version: "1.0"
name: workflow-202610181712
displayName: workflow-202610181712
stages:
  - name: build
    displayName: 构建并发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: build_nodejs
        displayName: Nodejs 构建
        nodeVersion: "24.13.0"
        commands:
          - echo "GITEE_BRANCH=[${GITEE_BRANCH}]"
          - echo "GITEE_COMMIT=[${GITEE_COMMIT}]"
          - npm config set registry https://registry.npmmirror.com
          - npm install && npm test && npm run build:min
          - cp dist/index.html ./totp-web.html
          - ls -lh ./totp-web.html
          - echo "VERSION=$(node -p "require('./package.json').version")" >> GITEE_PARAMS
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - totp-web.html
        caches:
          - "~/.npm"
        strategy:
          retry: "0"
        resource:
          cpu: "2"
          memory: "4"

      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        releaseName: totp-web v${VERSION}
        description: 单文件离线 TOTP 验证器，下载 html 双击即可使用。
        tagName: v${VERSION}
        upstreamArtifact:
          - BUILD_ARTIFACT
        assertFiles:
          - totp-web.html
        prerelease: false
        allowUpdate: true
        strategy:
          retry: "0"
        resource:
          cpu: "1"
          memory: "2"
        dependsOn: build_nodejs
triggers:
  trigger: auto
  push:
    tags:
      prefix:
        - v
notify: []
